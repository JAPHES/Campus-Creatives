{% extends 'base.html' %}
{% block title %}Log in — Campus Creatives{% endblock %}
{% block content %}<div class="mx-auto flex min-h-[70vh] max-w-md items-center px-4 py-12"><div class="paper-card w-full rounded-3xl p-6 sm:p-9"><div class="brand-mark flex h-12 w-12 items-center justify-center rounded-2xl text-xl">✦</div><h1 class="display-face mt-6 text-4xl">Welcome back.</h1><p class="mt-2 text-sm text-black/55">Continue turning good ideas into finished work.</p><form method="post" class="form-shell mt-7">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button type="submit" class="btn-primary w-full">Log in</button></form><p class="mt-5 text-center text-sm text-black/55">New here? <a class="font-black text-black" href="{% url 'accounts:register' %}">Create an account</a></p></div></div>{% endblock %}
